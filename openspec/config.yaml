# openspec/config.yaml — kanban-tui SDD configuration
# Generated by sdd-init (hybrid mode: OpenSpec + Engram). Do not edit manually unless you know what you are changing.

schema: spec-driven

context: |
  Event-sourced personal kanban CLI + TUI (Go 1.26, cobra, Bubbletea, pure-Go SQLite).
  Append-only event log; state is reconstructed from events (task.new/done/update, scope.shift/expand, note).
  Host-neutral core: cmd/kb + internal/{buildinfo,cli,db,event,project,store,tui}; no AI-host dependency.
  Automation at the host boundary only: integrations/opencode/kanban.ts (OpenCode plugin).
  No CI pipeline; Makefile drives build/test. Tests run with `go test ./...`.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Any new event type requires a migration in internal/db/migrations (numbered, append-only)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Preserve event-sourced semantics: history is append-only, never rewritten
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Keep the core host-neutral; AI-host adapters only at the boundary (integrations/)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (event-sourced core, host-neutral)
    tdd: true
    test_command: "go test ./..."
  verify:
    test_command: "go test ./..."
    build_command: "go build ./..."
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  runner: go test ./...
  layers:
    unit: go test ./...
    integration: go test ./... (in-memory SQLite via internal/db/testdb.go OpenTest)
    e2e: null
  coverage_command: go test -cover ./...
  quality:
    linter: null
    type_checker: go vet ./...
    formatter: gofmt
